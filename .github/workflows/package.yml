name: Package WebUI
on:
  push:
    paths:
      - '.github/workflows/package.yml'
      - 'src/**'
      - 'web/**'
      - 'plugin.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build && npm test
      - name: Generate binary assets and market index
        run: |
          python3 make_metadata.py
          python3 tools/plugins/package_v2.py . releases/0.1.0/plugin-0.1.0.tar.gz
          python3 make_metadata.py
          python3 - <<'PY'
          import json,hashlib,pathlib,tarfile
          root=pathlib.Path('.')
          m=json.loads((root/'gk-plugin.json').read_text())
          p=root/m['versions'][0]['package']
          assert p.read_bytes()[:2]==b'\x1f\x8b'
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m['versions'][0]['sha256']
          assert (root/'assets/icon.png').read_bytes()[:8]==b'\x89PNG\r\n\x1a\n'
          with tarfile.open(p) as t: assert 'plugin.json' in t.getnames()
          PY
      - name: Commit verified package
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add code/start.js assets/icon.png releases/0.1.0/plugin-0.1.0.tar.gz gk-plugin.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build verified WebUI 0.1.0 binary package"
          git push
